<ion-header>
  <ion-toolbar>
    <ion-title id="settings-title">
      {{'ocm.general.settings' | translate}}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="settings-page ion-padding" aria-labelledby="settings-title" aria-label="Settings page"
  id="settings-page-content">
<h2 id="settings-general-heading">
  General Settings
</h2>

<ion-item id="settings-language-item">
  <ion-select label="Language" [(ngModel)]="searchSettings.Language" (ionChange)="onLanguageChange()" multiple="false"
    placeholder="Select" aria-label="Language" id="settings-language-select">
    @for (item of languages; track item) {
      <ion-select-option [value]="item.code">{{item.title}}</ion-select-option>
    }
  </ion-select>
</ion-item>

<ion-item id="settings-map-type-item">

  <ion-select [label]="'ocm.details.location.map'| translate" [(ngModel)]="searchSettings.MapType"
    (ionChange)="onMapTypeChange()" multiple="false" cancelText="Cancel" okText="OK" placeholder="Select"
    disabled="true" aria-label="Map type" id="settings-map-type-select">
    <ion-select-option value="ROADMAP">Road Map</ion-select-option>
    <ion-select-option value="SATELLITE">Satellite</ion-select-option>
  </ion-select>
</ion-item>

<ion-item id="settings-advanced-editor-item">
  <ion-toggle label-placement="end" [(ngModel)]="searchSettings.EnableAdvancedEditorFeatures"
    aria-label="Enable Advanced Editor Options" id="settings-advanced-editor-toggle">Enable Advanced Editor
  Options</ion-toggle>
</ion-item>
<ion-item id="settings-pending-approval-item">
  <ion-toggle label-placement="end" [(ngModel)]="searchSettings.EnablePOIPendingApproval"
    aria-label="Show POIs Pending Approval" id="settings-pending-approval-toggle">Show POIs Pending
  Approval</ion-toggle>
</ion-item>

<ion-item id="settings-max-results-item">
  <ion-input label="Max Results" type="number" placeholder="500" [(ngModel)]="searchSettings.MaxResults" min="100"
  max="10000" aria-label="Maximum results" id="settings-max-results-input"></ion-input>
</ion-item>

</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button (click)="close()" aria-label="Close settings" id="settings-close-button">
        <ion-icon name="close" slot="start"></ion-icon>
        Close
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-footer>
