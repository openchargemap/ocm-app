@if (placeSearchActive) {
  <div class="place-search">
    @if (searchInProgress) {
      <div>
        <ion-spinner></ion-spinner>
      </div>
    }
    <ion-list>
      @for (item of placeList; track item) {
        <ion-item (click)="placeSelected(item)">
          <ion-avatar item-left>
            <ion-icon name="locate"></ion-icon>
          </ion-avatar>
          <ion-label>
            <p>{{item.Address}}</p>
          </ion-label>
        </ion-item>
      }
      <ion-item>
        <p class="place-attribution" [innerHTML]="placeAttribution"></p>
      </ion-item>
    </ion-list>
  </div>
}
